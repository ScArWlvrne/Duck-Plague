name: Build Duck-Plague

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            qt_arch: gcc_64
            artifact_name: Duck-Plague-linux
            build_dir: build
            app_path: build/DuckPlague

          - os: macos-latest
            qt_arch: clang_64
            artifact_name: Duck-Plague-macos
            build_dir: build
            app_path: build/DuckPlague.app

          - os: windows-latest
            qt_arch: win64_msvc2022_64
            artifact_name: Duck-Plague-windows
            build_dir: build
            app_path: build/Release/DuckPlague.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Install Qt
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: ${{ matrix.qt_arch }}
          cache: true

      # CMake configure
      - name: Configure (Linux/macOS)
        if: runner.os != 'Windows'
        run: cmake -S . -B ${{ matrix.build_dir }} -DCMAKE_BUILD_TYPE=Release

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake -S . -B ${{ matrix.build_dir }} -DCMAKE_BUILD_TYPE=Release

      # Build
      - name: Build (Linux/macOS)
        if: runner.os != 'Windows'
        run: cmake --build ${{ matrix.build_dir }} --config Release -j 2

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake --build ${{ matrix.build_dir }} --config Release

      # Upload the built app
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.app_path }}
